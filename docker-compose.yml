name: recicla-belo

services:
  banco:
    image: postgres:18.6-alpine
    container_name: recicla-belo-postgres-v18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BANCO_NOME}
      POSTGRES_USER: ${BANCO_USUARIO}
      POSTGRES_PASSWORD: ${BANCO_SENHA}
    ports:
      - "127.0.0.1:${BANCO_PORTA:-5432}:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql
      - ./servidor/migracoes:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BANCO_USUARIO} -d ${BANCO_NOME}"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    shm_size: 128mb

volumes:
  dados_postgres:
    name: recicla_belo_dados_postgres_v18
